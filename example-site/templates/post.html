{% extends "base.html" %}
{% block content %}
<article>
  <h1>{{ page.title }}</h1>
  {% if page.date %}<time datetime="{{ page.date.isoformat() }}">{{ page.date.strftime('%B %d, %Y') }}</time>{% endif %}
  {% if page.tags %}
  <ul class="tags">
    {% for tag in page.tags %}<li>{{ tag }}</li>{% endfor %}
  </ul>
  {% endif %}
  {{ content | safe }}
</article>
{% endblock %}
